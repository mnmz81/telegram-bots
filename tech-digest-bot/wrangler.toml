name = "tech-digest-bot"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "tech-digest-bot"
# paste the id printed by `npx wrangler d1 create tech-digest-bot`
database_id = "e5449775-41b4-49a5-a124-e416f0c23acb"
migrations_dir = "migrations"

[triggers]
# :50 fetches a slice of the feeds + breaking check; :00 sends digests / the weekly email when the Israel hour matches
crons = ["50 * * * *", "0 * * * *"]
